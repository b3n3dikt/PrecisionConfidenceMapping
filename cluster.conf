#!/bin/bash
# =============================================================================
# cluster.conf  —  Cluster-specific settings for PCM
# =============================================================================
# Copy this file to your project directory alongside run_PCM.sh and edit it.
# PCM will automatically use your local copy if it finds one in the directory
# where you run sbatch; otherwise it falls back to these defaults.
#
# WHAT TO EDIT:
#   SLURM_PARTITION  — partition(s) to submit jobs to  (check: sinfo -s)
#   SLURM_ACCOUNT    — your SLURM account / group      (check: sacctmgr show user)
#   MATLAB_MODULE    — matlab module name               (check: module avail matlab)
#   WORKBENCH_MODULE — workbench module name            (check: module avail workbench)
#   PYTHON_MODULE    — python3 module name              (check: module avail python)
#   REPROTM_DIR       — OPTIONAL override (only needed for METHOD=reprotm). Leave
#                      commented out to use the auto-fetched copy — run
#                      `bash code/setup_reprotm.sh` once (see PrecisionConfidenceMapping_guide.html
#                      Section 2c). Only set this if you want to point at your own
#                      separately managed ReproTM install instead. See
#                      deps/reprotm/README.md for the expected folder layout.
#   REPROTM_PYTHON   — python with nibabel+scipy+numpy  (only needed for METHOD=reprotm)
#                      The default `python3` usually lacks nibabel. Point this at a
#                      conda env's python (e.g. /home/.../miniconda3/envs/pcm/bin/python),
#                      or run: pip install --user nibabel scipy numpy
#
#   SLURM resource sizing (below) — per-method permutation-job defaults, and fixed
#   sizes for the orchestrator/distance-matrix/figure-making auxiliary jobs. These
#   are used unless overridden per-run (ntasks/mem/tmpspace/time in run_PCM.sh
#   USER SETTINGS, still take precedence for the main permutation job). Site admins
#   tune these once here instead of every user editing run_PCM.sh directly.
#
#   ONE THING THIS FILE CANNOT COVER: run_PCM.sh's own top-of-file #SBATCH
#   partition/account (the very first job SLURM submits). SLURM reads #SBATCH
#   pragmas at submit time, before the script body runs and could source this
#   file — so that one line still needs a one-time edit, or pass
#   `sbatch --partition=... --account=... run_PCM.sh` at the command line.
# =============================================================================

export SLURM_PARTITION="msismall,ag2tb,msilarge,preempt,msibigmem"
export SLURM_ACCOUNT="faird"
export MATLAB_MODULE="matlab/R2019a"
export WORKBENCH_MODULE="workbench"
export PYTHON_MODULE="python3"
# REPROTM_DIR intentionally left unset here (not exported as "") — config.sh
# defaults it to the auto-fetched deps/reprotm_fetched/ if code/setup_reprotm.sh
# has been run. Uncomment below only to override with your own ReproTM install:
# export REPROTM_DIR="/path/to/your/ReproTM"
export REPROTM_PYTHON="/projects/standard/faird/shared/code/external/envs/miniconda3/mini3/bin/python"   # Set this to a python with nibabel/scipy/numpy if using METHOD=reprotm

# ── Per-method permutation-job resource defaults ──────────────────────────────
# Used when ntasks/mem/tmpspace/time are left empty (run_PCM.sh USER SETTINGS or
# --num/--mem-style overrides are not set).
export MATLABTM_NTASKS=1   MATLABTM_MEM="160gb"  MATLABTM_TMPSPACE="100gb"  MATLABTM_TIME="10:00:00"
# ^ bumped from 128gb 2026-07-27: OOM at exactly 128GB on a trunc-25m-start +
#   bootstrap_variable permutation (job 14039656) that had never been run at this
#   truncation/shuffle combination before -- 128gb was a tight margin (~29gb over
#   the ~99gb Zscore_dconn peak measured on a 70-min truncation run), not
#   independently validated per shuffle/truncation combo. Revisit down (reduce
#   usage) once matlab_tm's actual memory footprint is profiled instead of tuned
#   by trial and error.
export REPROTM_NTASKS=1    REPROTM_MEM="200gb"   REPROTM_TMPSPACE="100gb"  REPROTM_TIME="12:00:00"

# ── Auxiliary job resources (fixed; not method-dependent) ─────────────────────
export ORCHESTRATOR_MEM="20gb"   ORCHESTRATOR_TIME="48:00:00"   # long-lived polling/submission job
export MAKEFIGS_MEM="64gb"       MAKEFIGS_TIME="1:00:00"        # figure aggregation
